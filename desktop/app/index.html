<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>neirox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<script>
// Свой шрифт со смайликами только там, где нет системного цветного: Windows 7 и старше, Linux
(function () {
  var u = navigator.userAgent, m = /Windows NT (\d+)\.(\d+)/.exec(u);
  var old = m && (+m[1] < 6 || (+m[1] === 6 && +m[2] <= 1));
  var lin = /Linux/.test(u) && !/Android/.test(u);
  if (old || lin) {
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = 'emoji-font.css';
    document.head.appendChild(l);
  }
})();
</script>
</head>
<body>
<div id="auth" class="hidden"></div>
<div id="app" class="hidden">
  <nav id="rail"></nav>
  <main id="content"></main>
</div>
<div id="modal" class="hidden"></div>
<div id="ctx" class="hidden"></div>
<div id="viewer" class="hidden"></div>
<div id="call" class="hidden"></div>
<div id="upd" class="hidden"></div>
<audio id="call-audio" autoplay></audio>
<div id="toast" class="hidden"></div>
<audio id="aud"></audio>
<input type="file" id="pick-photo" accept="image/*,video/*" multiple class="hidden">
<input type="file" id="pick-file" multiple class="hidden">
<input type="file" id="pick-avatar" accept="image/*" class="hidden">
<input type="file" id="pick-music" accept="audio/*,video/mp4,.mp4,.m4a,.mp3,.wav,.ogg,.opus,.flac,.aac,.webm" multiple class="hidden">
<script src="app.js"></script>
</body>
</html>
