<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>neirox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth" class="hidden"></div>
<div id="app" class="hidden">
  <nav id="rail"></nav>
  <main id="content"></main>
</div>
<div id="modal" class="hidden"></div>
<div id="ctx" class="hidden"></div>
<div id="viewer" class="hidden"></div>
<div id="toast" class="hidden"></div>
<audio id="aud"></audio>
<input type="file" id="pick-photo" accept="image/*,video/*" multiple class="hidden">
<input type="file" id="pick-file" multiple class="hidden">
<input type="file" id="pick-avatar" accept="image/*" class="hidden">
<input type="file" id="pick-music" accept="audio/*,video/mp4,.mp4,.m4a,.mp3,.wav,.ogg,.opus,.flac,.aac,.webm" multiple class="hidden">
<script src="app.js"></script>
</body>
</html>
