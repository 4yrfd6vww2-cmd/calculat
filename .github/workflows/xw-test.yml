name: XW test
on:
  push:
    branches: [xw-test]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            https://download.01.org/crosswalk/releases/crosswalk/android/maven2/org/xwalk/xwalk_core_library/23.53.589.4/xwalk_core_library-23.53.589.4.aar \
            https://download.01.org/crosswalk/releases/crosswalk/android/maven2/org/xwalk/xwalk_core_library/maven-metadata.xml \
            https://repo1.maven.org/maven2/org/xwalk/xwalk_core_library/maven-metadata.xml \
            https://jitpack.io/org/xwalk/xwalk_core_library/23.53.589.4/xwalk_core_library-23.53.589.4.aar \
            https://maven.aliyun.com/repository/public/org/xwalk/xwalk_core_library/23.53.589.4/xwalk_core_library-23.53.589.4.aar \
            https://github.com/crosswalk-project/crosswalk/releases ; do
            echo "== $u"; curl -sIL -m 30 "$u" | head -3
          done
